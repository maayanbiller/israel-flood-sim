<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Israel Flood Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 12, 41, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
        }
        h2 { margin: 0 0 15px 0; font-weight: 400; letter-spacing: 1px; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        label { font-size: 0.9rem; color: #ccc; }
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 6px;
            background: #333; border-radius: 3px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            background: #007bff; border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem; font-weight: 300; letter-spacing: 2px;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div id="loading">GENERATING NEXT-GEN TERRAIN...</div>
    <div id="ui">
        <h2>Flood Controls</h2>
        <div class="controls" id="controls" style="display:none;">
            <label>Sea Level: <span id="val">0</span> meters</label>
            <input type="range" id="seaLevel" min="0" max="1500" value="0">
            <label style="margin-top: 5px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="magmaMode" style="width: 16px; height: 16px;"> 🔥 Magma Mode
            </label>
            <p style="font-size: 0.8rem; color: #888;">Only regions connected to the ocean will flood.</p>
        </div>
    </div>
    
    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        
        // 3D Skybox for True Infinite Horizon
        const vertexShaderSky = `
            varying vec3 vWorldPosition;
            void main() {
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        const fragmentShaderSky = `
            varying vec3 vWorldPosition;
            void main() {
                vec3 dir = normalize(vWorldPosition);
                vec3 skyColor = vec3(0.02, 0.05, 0.12);
                vec3 horizonColor = vec3(0.4, 0.54, 0.6);
                float mixVal = smoothstep(-0.1, 0.4, dir.y);
                gl_FragColor = vec4(mix(horizonColor, skyColor, mixVal), 1.0);
            }
        `;
        const skyGeo = new THREE.SphereGeometry(2000, 32, 15);
        const skyMat = new THREE.ShaderMaterial({
            vertexShader: vertexShaderSky,
            fragmentShader: fragmentShaderSky,
            side: THREE.BackSide,
            depthWrite: false
        });
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);
        
        // Fog matches the horizon color
        scene.fog = new THREE.FogExp2(0x668a99, 0.006); 
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 4000);
        camera.position.set(0, 80, 180);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.01; 
        controls.minDistance = 2;
        controls.maxDistance = 500; 
        controls.enablePan = true; // RESTORED PANNING! We will use smart collision instead.
        
        // 2. Load Local Data
        const textureLoader = new THREE.TextureLoader();
        const satTexture = textureLoader.load('data/sat.jpg', () => checkLoad());
        const elevTexture = textureLoader.load('data/elev.png', () => checkLoad());
        
        satTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        elevTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        
        let loadedCount = 0;
        let elevationData = null; 
        let maskData = null; 
        let maskTexture = null;
        let imgW = 768; 
        let imgH = 1280; 
        let currentSeaLevel = 0;
        
        function checkLoad() {
            loadedCount++;
            if (loadedCount === 2) initTerrain();
        }
        
        function initTerrain() {
            const img = elevTexture.image;
            imgW = img.width;
            imgH = img.height;
            
            const canvas = document.createElement('canvas');
            canvas.width = imgW;
            canvas.height = imgH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, imgW, imgH).data;
            
            elevationData = new Float32Array(imgW * imgH);
            maskData = new Uint8Array(imgW * imgH);
            
            for (let i = 0; i < imgW * imgH; i++) {
                const r = imgData[i*4];
                const g = imgData[i*4+1];
                const b = imgData[i*4+2];
                elevationData[i] = (r * 256.0 + g + b / 256.0) - 32768.0;
            }
            
            maskTexture = new THREE.DataTexture(maskData, imgW, imgH, THREE.LuminanceFormat, THREE.UnsignedByteType);
            maskTexture.magFilter = THREE.NearestFilter;
            maskTexture.minFilter = THREE.NearestFilter;
            maskTexture.needsUpdate = true;
            
            buildMeshes();
            updateFloodMask(0); 
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
        }
        
        function updateFloodMask(seaLevel) {
            if (!elevationData) return;
            for (let i = 0; i < maskData.length; i++) maskData[i] = 0;
            
            const queue = new Int32Array(imgW * imgH); 
            let head = 0;
            let tail = 0;
            
            queue[tail++] = 0;
            maskData[0] = 255; 
            
            const redSeaIdx = (imgH - 1) * imgW + 400;
            if (elevationData[redSeaIdx] <= seaLevel) {
                queue[tail++] = redSeaIdx;
                maskData[redSeaIdx] = 255;
            }
            
            const dirs = [-1, 1, -imgW, imgW];
            
            while (head < tail) {
                const idx = queue[head++];
                const x = idx % imgW;
                
                for (let d = 0; d < 4; d++) {
                    if (d === 0 && x === 0) continue; 
                    if (d === 1 && x === imgW - 1) continue;
                    
                    const nIdx = idx + dirs[d];
                    
                    if (nIdx >= 0 && nIdx < elevationData.length) {
                        if (maskData[nIdx] === 0 && elevationData[nIdx] <= seaLevel) {
                            maskData[nIdx] = 255;
                            queue[tail++] = nIdx;
                        }
                    }
                }
            }
            maskTexture.needsUpdate = true;
        }
        
        let terrainUniforms = null;
        let water = null;
        
        function buildMeshes() {
            maskTexture.flipY = true;
            
            terrainUniforms = {
                tDiffuse: { value: satTexture },
                tElevation: { value: elevTexture },
                exaggeration: { value: 0.5 },
                cameraPos: { value: camera.position }
            };
            
            const vertexShader = `
                uniform sampler2D tElevation;
                uniform float exaggeration;
                varying vec2 vUv;
                varying vec3 vWorldPosition;
                
                void main() {
                    vUv = uv;
                    vec4 elev = texture2D(tElevation, uv);
                    float heightMeters = (elev.r * 255.0 * 256.0 + elev.g * 255.0 + elev.b * 255.0 / 256.0) - 32768.0;
                    float scaledHeight = heightMeters * 0.005 * exaggeration;
                    vec3 newPosition = position + normal * scaledHeight;
                    
                    vec4 worldPosition = modelMatrix * vec4(newPosition, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPosition;
                }
            `;
            
            // FRACTAL NOISE DETAILS FOR MAX ZOOM
            const fragmentShader = `
                uniform sampler2D tDiffuse;
                uniform sampler2D tElevation;
                uniform float exaggeration;
                uniform vec3 cameraPos;
                varying vec2 vUv;
                varying vec3 vWorldPosition;
                
                float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
                float noise(vec2 p) {
                    vec2 i = floor(p); vec2 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
                }
                float fbm(vec2 p) {
                    float f = 0.0; float w = 0.5;
                    for (int i = 0; i < 4; i++) {
                        f += w * noise(p); p *= 2.0; w *= 0.5;
                    }
                    return f;
                }
                
                void main() {
                    vec4 texColor = texture2D(tDiffuse, vUv);
                    
                    // Generate Macro Normals (Lighting)
                    vec2 texel = vec2(1.0 / 768.0, 1.0 / 1280.0);
                    float hL = (texture2D(tElevation, vUv - vec2(texel.x, 0.0)).r * 255.0 * 256.0 + texture2D(tElevation, vUv - vec2(texel.x, 0.0)).g * 255.0) - 32768.0;
                    float hR = (texture2D(tElevation, vUv + vec2(texel.x, 0.0)).r * 255.0 * 256.0 + texture2D(tElevation, vUv + vec2(texel.x, 0.0)).g * 255.0) - 32768.0;
                    float hD = (texture2D(tElevation, vUv - vec2(0.0, texel.y)).r * 255.0 * 256.0 + texture2D(tElevation, vUv - vec2(0.0, texel.y)).g * 255.0) - 32768.0;
                    float hU = (texture2D(tElevation, vUv + vec2(0.0, texel.y)).r * 255.0 * 256.0 + texture2D(tElevation, vUv + vec2(0.0, texel.y)).g * 255.0) - 32768.0;
                    
                    float zScale = 0.005 * exaggeration;
                    vec3 va = normalize(vec3(texel.x * 120.0, 0.0, (hR - hL) * zScale));
                    vec3 vb = normalize(vec3(0.0, texel.y * 200.0, (hU - hD) * zScale));
                    vec3 macroNormal = normalize(cross(va, vb));
                    
                    // GENERATE MICRO-DETAILS FOR MAXIMUM ZOOM QUALITY!
                    float dist = length(cameraPos - vWorldPosition);
                    float detailFade = clamp(1.0 - (dist / 100.0), 0.0, 1.0); // Fades in when close
                    
                    float detailNoise = fbm(vUv * 2000.0);
                    vec3 detailNormal = normalize(vec3(
                        fbm(vUv * 2000.0 + vec2(0.01, 0.0)) - detailNoise,
                        fbm(vUv * 2000.0 + vec2(0.0, 0.01)) - detailNoise,
                        0.5
                    ));
                    
                    // Blend normal
                    vec3 finalNormal = normalize(macroNormal + detailNormal * detailFade * 1.5);
                    
                    // Add micro-texture color
                    vec3 detailColor = mix(vec3(0.7), vec3(1.3), detailNoise);
                    texColor.rgb *= mix(vec3(1.0), detailColor, detailFade * 0.4);
                    
                    // Sunlight
                    vec3 sunDir = normalize(vec3(-1.0, 0.6, 0.5));
                    float diff = max(dot(finalNormal, sunDir), 0.0);
                    
                    vec3 ambient = vec3(0.3, 0.4, 0.6); 
                    vec3 diffuse = vec3(1.2, 1.0, 0.8) * diff * 1.5;
                    
                    vec3 finalLighting = texColor.rgb * (ambient + diffuse);
                    gl_FragColor = vec4(finalLighting, 1.0);
                }
            `;
            
            const terrainMaterial = new THREE.ShaderMaterial({
                uniforms: terrainUniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                side: THREE.DoubleSide
            });
            
            const geometry = new THREE.PlaneGeometry(120, 200, 511, 511);
            geometry.rotateX(-Math.PI / 2);
            
            const terrain = new THREE.Mesh(geometry, terrainMaterial);
            scene.add(terrain);
            
            // INFINITE OCEAN SKIRT - A massive plane to hide floating mesh edges
            const oceanGeo = new THREE.PlaneGeometry(100000, 100000, 1, 1);
            oceanGeo.rotateX(-Math.PI / 2);
            const oceanMat = new THREE.MeshBasicMaterial({ color: 0x061122 }); 
            const oceanSkirt = new THREE.Mesh(oceanGeo, oceanMat);
            oceanSkirt.position.y = -1.0; 
            scene.add(oceanSkirt);

            const waterUniforms = {
                tElevation: { value: elevTexture },
                tMask: { value: maskTexture },
                exaggeration: { value: 0.5 },
                seaLevel: { value: 0.0 },
                u_time: { value: 0.0 },
                isMagma: { value: 0.0 }
            };
            
            const waterVert = `
                uniform sampler2D tElevation;
                uniform sampler2D tMask;
                uniform float exaggeration;
                uniform float seaLevel;
                uniform float u_time;
                uniform float isMagma;
                varying vec2 vUv;
                varying float vMask;
                varying vec3 vWorldPosition;
                
                void main() {
                    vUv = uv;
                    vMask = texture2D(tMask, uv).r; 
                    
                    float wave = sin(uv.x * 60.0 + u_time * 2.0) * cos(uv.y * 60.0 + u_time * 1.5) * 0.3;
                    float magmaWave = sin(uv.x * 20.0 + u_time * 0.5) * 0.5;
                    float finalWave = isMagma < 0.5 ? wave : magmaWave;
                    
                    float height = vMask > 0.5 ? (seaLevel + 1.0 + finalWave) : 0.0;
                    float scaledHeight = height * 0.005 * exaggeration;
                    
                    vec3 newPosition = position + normal * scaledHeight;
                    vec4 worldPosition = modelMatrix * vec4(newPosition, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPosition;
                }
            `;
            
            const waterFrag = `
                uniform sampler2D tElevation;
                uniform float seaLevel;
                uniform float u_time;
                uniform float isMagma;
                varying vec2 vUv;
                varying float vMask;
                varying vec3 vWorldPosition;
                
                float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
                float noise(vec2 p) {
                    vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
                    return mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), f.x),
                               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
                }
                
                void main() {
                    if (vMask < 0.5) discard; 
                    
                    vec4 elevData = texture2D(tElevation, vUv);
                    float elevation = (elevData.r * 255.0 * 256.0 + elevData.g * 255.0 + elevData.b * 255.0 / 256.0) - 32768.0;
                    float depth = max(0.0, seaLevel - elevation);
                    
                    vec3 shallowWater = vec3(0.0, 0.8, 0.9);
                    vec3 deepWater = vec3(0.0, 0.1, 0.4);
                    float depthFactor = clamp(depth / 150.0, 0.0, 1.0);
                    vec3 waterColor = mix(shallowWater, deepWater, depthFactor);
                    
                    vec3 magmaEdge = vec3(1.0, 0.2, 0.0); 
                    vec3 magmaCore = vec3(1.0, 0.9, 0.3); 
                    
                    vec2 waveUv = vUv * 500.0;
                    vec3 normal = normalize(vec3(
                        noise(waveUv + vec2(0.1, 0.0)) - noise(waveUv - vec2(0.1, 0.0)),
                        noise(waveUv + vec2(0.0, 0.1)) - noise(waveUv - vec2(0.0, 0.1)),
                        1.2 
                    ));
                    
                    vec3 sunDir = normalize(vec3(1.0, 1.0, 0.8));
                    vec3 viewDir = normalize(cameraPosition - vWorldPosition); 
                    vec3 halfVector = normalize(sunDir + viewDir);
                    
                    float specular = pow(max(dot(normal, halfVector), 0.0), 40.0) * (1.0 - isMagma);
                    
                    float foam = 0.0;
                    if (depth < 12.0 && isMagma < 0.5) {
                        foam = smoothstep(0.3, 1.0, noise(waveUv * 4.0 + u_time * 2.0)) * (1.0 - depth/12.0);
                    }
                    
                    vec3 finalColor = waterColor + vec3(specular * 0.8) + vec3(foam);
                    
                    if (isMagma > 0.5) {
                        float lavaFlow = noise(vUv * 80.0 + u_time * 0.3);
                        float crustNoise = noise(vUv * 300.0 - u_time * 0.1);
                        vec3 magmaColor = mix(magmaEdge, magmaCore, smoothstep(0.2, 0.8, lavaFlow));
                        float crustThreshold = smoothstep(0.4, 0.7, crustNoise);
                        vec3 crustColor = vec3(0.05, 0.02, 0.01);
                        finalColor = mix(magmaColor * 1.5, crustColor, crustThreshold);
                    }
                    
                    float alpha = mix(clamp(depth / 15.0, 0.6, 0.95), 1.0, isMagma);
                    gl_FragColor = vec4(finalColor, alpha);
                }
            `;
            
            const waterMaterial = new THREE.ShaderMaterial({
                uniforms: waterUniforms,
                vertexShader: waterVert,
                fragmentShader: waterFrag,
                transparent: true,
                side: THREE.DoubleSide
            });
            
            water = new THREE.Mesh(geometry, waterMaterial);
            scene.add(water);
            
            const slider = document.getElementById('seaLevel');
            const valLabel = document.getElementById('val');
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                valLabel.innerText = val;
                currentSeaLevel = val;
                updateFloodMask(val);
                waterUniforms.seaLevel.value = val;
            });
            
            const magmaToggle = document.getElementById('magmaMode');
            magmaToggle.addEventListener('change', (e) => {
                waterUniforms.isMagma.value = e.target.checked ? 1.0 : 0.0;
            });
        }
        
        // SMART CAMERA COLLISION DETECTION
        function getTerrainHeight(x, z) {
            if (!elevationData) return -100;
            
            // Map X from (-60 to 60) to U (0 to 1)
            let u = (x + 60.0) / 120.0;
            // Map Z from (-100 to 100) to V (0 to 1)
            let v = (z + 100.0) / 200.0;
            
            if (u < 0 || u >= 1 || v < 0 || v >= 1) {
                // If off the map, clamp to sea level or 0
                return Math.max(0, currentSeaLevel * 0.005 * 0.5);
            }
            
            let px = Math.floor(u * imgW);
            let py = Math.floor(v * imgH); 
            px = Math.max(0, Math.min(imgW - 1, px));
            py = Math.max(0, Math.min(imgH - 1, py));
            
            let heightMeters = elevationData[py * imgW + px];
            return heightMeters * 0.005 * 0.5; // exaggeration factor
        }
        
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Apply Camera Collision
            if (elevationData) {
                let th = getTerrainHeight(camera.position.x, camera.position.z);
                let minCamY = th + 1.5; // Stay 1.5 units above ground
                if (camera.position.y < minCamY) {
                    camera.position.y = minCamY;
                }
            }
            
            if (terrainUniforms) {
                terrainUniforms.cameraPos.value.copy(camera.position);
            }
            if (water) {
                water.material.uniforms.u_time.value = clock.getElapsedTime();
            }
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
