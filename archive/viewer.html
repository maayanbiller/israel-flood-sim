<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Terrain Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #cesiumContainer { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // We do NOT set an access token. 
    // Cesium will automatically use its internal evaluation token.
    // It will show a text warning at the bottom, but the 3D globe and satellite imagery WILL load.
    
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain()
    });

    // Fly to Israel
    viewer.camera.flyTo({
      destination : Cesium.Cartesian3.fromDegrees(34.8, 31.0, 1500000.0), // Zoomed out a bit more to ensure it's visible
      duration: 2.0
    });
  </script>
</body>
</html>
