<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>3D Terrain with MapLibre</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    
    <!-- MapLibre GL JS (Free and Open Source, No API Keys required) -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        const map = new maplibregl.Map({
            container: 'map',
            zoom: 7, 
            center: [35.0, 31.5], 
            pitch: 65, 
            maxPitch: 85, // Allows the camera to rotate almost completely horizontally
            bearing: 0,
            style: {
                version: 8,
                sources: {
                    // Cleaner map style (Carto Voyager) - fewer labels, very clean roads
                    'clean-map-tiles': {
                        type: 'raster',
                        tiles: [
                            'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png',
                            'https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png',
                            'https://c.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png'
                        ],
                        tileSize: 256,
                        attribution: '© OpenStreetMap contributors, © CARTO'
                    },
                    // 3D elevation data
                    'terrain-source': {
                        type: 'raster-dem',
                        tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
                        encoding: 'terrarium',
                        tileSize: 256,
                        maxzoom: 14
                    }
                },
                layers: [
                    {
                        id: 'base-map',
                        type: 'raster',
                        source: 'clean-map-tiles'
                    },
                    // Add dynamic shading to make the mountains and valleys pop out visually
                    {
                        id: 'hills',
                        type: 'hillshade',
                        source: 'terrain-source',
                        paint: {
                            'hillshade-exaggeration': 1.0,
                            'hillshade-shadow-color': '#111111',
                            'hillshade-highlight-color': '#FFFFFF'
                        }
                    }
                ],
                // Apply the 3D terrain to the map
                terrain: {
                    source: 'terrain-source',
                    exaggeration: 3.5 // Increased exaggeration as requested
                }
            }
        });

        // Add standard navigation controls
        map.addControl(
            new maplibregl.NavigationControl({
                visualizePitch: true,
                showZoom: true,
                showCompass: true
            })
        );
    </script>
</body>
</html>
