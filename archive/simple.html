<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simple Flood Sim</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.100/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.100/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #cesiumContainer { width: 100%; height: 100%; }
    #ui-panel { 
        position: absolute; 
        top: 20px; 
        left: 20px; 
        background: rgba(255,255,255,0.9); 
        padding: 15px; 
        border-radius: 5px; 
        z-index: 999;
        font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="ui-panel">
    <strong>Sea Level (meters):</strong> <span id="val">0</span><br><br>
    <input type="range" id="seaLevel" min="0" max="1000" value="0" style="width: 200px;">
  </div>
  
  <script>
    // Create viewer. Disable all the default extra UI widgets to keep it clean.
    // Use OpenStreetMap to guarantee imagery loads without an API key.
    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false,
      timeline: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      baseLayerPicker: false,
      infoBox: false,
      imageryProvider: new Cesium.OpenStreetMapImageryProvider({
        url : 'https://a.tile.openstreetmap.org/'
      })
    });

    // Try to add World Terrain for topography (mountains)
    try {
        viewer.terrainProvider = Cesium.createWorldTerrain();
    } catch(e) {
        console.warn("Could not load terrain.");
    }

    // Zoom directly to Israel
    viewer.camera.flyTo({
      destination : Cesium.Cartesian3.fromDegrees(34.8, 31.0, 800000.0)
    });

    // Create the blue water plane
    const water = viewer.entities.add({
      polygon: {
        hierarchy: Cesium.Cartesian3.fromDegreesArray([
          33.0, 29.0, // Bottom Left
          36.0, 29.0, // Bottom Right
          36.0, 34.0, // Top Right
          33.0, 34.0  // Top Left
        ]),
        material: Cesium.Color.BLUE.withAlpha(0.6),
        height: 0,
        extrudedHeight: 0
      }
    });

    // Handle slider changes
    document.getElementById('seaLevel').addEventListener('input', function(e) {
      const val = parseFloat(e.target.value);
      document.getElementById('val').innerText = val;
      
      water.polygon.height = val;
      water.polygon.extrudedHeight = val > 0 ? 0 : undefined;
    });
  </script>
</body>
</html>
